services:
  - type: web
    name: hdd-failure-predictor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_LOGIN_ID
        sync: false  # set in Render's dashboard (Environment tab), not here -- leave unset (with APP_PASSWORD) to keep the app open
      - key: APP_PASSWORD
        sync: false  # set in Render's dashboard (Environment tab), not here -- leave unset (with APP_LOGIN_ID) to keep the app open
      - key: SMTP_HOST
        sync: false  # e.g. smtp.gmail.com -- required (with the 4 vars below) for the in-browser critical-alert emails; leave any unset to disable.
                     # This is separate from the scheduled GitHub Actions check (see .github/workflows/fleet-check.yml), which reads its
                     # own copies of these same 5 vars from GitHub Actions secrets, not from here.
      - key: SMTP_PORT
        sync: false  # e.g. 587
      - key: SMTP_USER
        sync: false  # the sending account's email address
      - key: SMTP_PASSWORD
        sync: false  # an APP password, not your regular account password -- most providers reject plain passwords for SMTP
      - key: ALERT_EMAIL_TO
        sync: false  # where critical-alert emails are sent
