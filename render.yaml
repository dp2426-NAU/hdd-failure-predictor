services:
  - type: web
    name: hdd-failure-predictor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PASSWORD
        sync: false  # set in Render's dashboard (Environment tab), not here -- leave unset to keep the app open
